name: Terraform validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.4"

      - name: Check formatting
        run: terraform fmt -check -recursive

  validate-module:
    name: validate module
    runs-on: ubuntu-latest
    needs: fmt
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.4"

      - name: Init module
        run: terraform init -backend=false -input=false

      - name: Validate module
        run: terraform validate -no-color

      - name: Test module
        run: terraform test -no-color

  validate-module-min-provider:
    name: validate module (minimum bpg/proxmox)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.4"

      - name: Pin the minimum bpg/proxmox version from versions.tf
        run: |
          min="$(grep -A1 'source  = "bpg/proxmox"' versions.tf | sed -n 's/.*">= \([0-9.]*\).*/\1/p')"
          test -n "$min"
          echo "Testing against bpg/proxmox $min"
          cat > min_provider_override.tf <<EOF
          terraform {
            required_providers {
              proxmox = {
                source  = "bpg/proxmox"
                version = "= $min"
              }
            }
          }
          EOF

      - name: Init module
        run: terraform init -backend=false -input=false

      - name: Validate module
        run: terraform validate -no-color

      - name: Test module
        run: terraform test -no-color

  validate-examples:
    name: validate example (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-only-edge-routed
            path: examples/api-only-edge-routed
          - name: basic
            path: examples/basic
          - name: homelab-six-vlans
            path: examples/homelab-six-vlans
          - name: multi-node
            path: examples/multi-node
          - name: no-dhcp
            path: examples/no-dhcp
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.4"

      - name: Init example
        run: terraform init -backend=false -input=false

      - name: Validate example
        run: terraform validate -no-color
